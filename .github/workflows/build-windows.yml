name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Publish latest Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Grammar String Deriver — Windows
          target_commitish: main
          make_latest: true
          generate_release_notes: false
          files: dist/*.exe
